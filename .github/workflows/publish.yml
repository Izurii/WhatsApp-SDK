name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { name, version } = require('./package.json');
          assert.equal(name, 'whatsapp-sdk-js');
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Tag must match the package version');
          NODE
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build and verify
        run: |
          yarn test
          yarn test:package
          yarn check-changelog
          yarn check-copyright-headers
          yarn npm audit --all --recursive --no-deprecations
      - name: Pack release artifact
        id: package
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const [{ name, version, filename, integrity }] = JSON.parse(
            execFileSync('npm', ['pack', '--json'], { encoding: 'utf8' }),
          );
          fs.writeFileSync('release-manifest.json', JSON.stringify({ name, version, filename, integrity }));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `filename=${filename}\n`);
          NODE
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-package
          path: |
            ${{ steps.package.outputs.filename }}
            release-manifest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: npm-package
          path: release
      - name: Publish verified artifact
        working-directory: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          async function publish() {
            const { name, version, filename, integrity } = JSON.parse(fs.readFileSync('release-manifest.json', 'utf8'));
            assert.equal(name, 'whatsapp-sdk-js');
            assert.equal(process.env.RELEASE_TAG, `v${version}`);
            assert.equal(filename, `${name}-${version}.tgz`);
            assert.match(filename, /^whatsapp-sdk-js-[0-9][0-9A-Za-z.+-]*\.tgz$/);
            const actualIntegrity = `sha512-${createHash('sha512').update(fs.readFileSync(filename)).digest('base64')}`;
            assert.equal(actualIntegrity, integrity, 'Release artifact integrity mismatch');
            const response = await fetch(`https://registry.npmjs.org/${name}/${encodeURIComponent(version)}`, {
              signal: AbortSignal.timeout(30000),
            });
            if (response.ok) {
              const existing = await response.json();
              assert.equal(existing.dist?.integrity, integrity, 'This version already exists with different contents; publish a new version');
              console.log(`${name}@${version} is already published with identical contents; skipping`);
              return;
            }
            assert.equal(response.status, 404, `Registry lookup failed: HTTP ${response.status}`);
            const distTag = version.includes('-') ? 'next' : 'latest';
            execFileSync('npm', ['publish', filename, '--access', 'public', '--tag', distTag], { stdio: 'inherit' });
          }
          publish().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
