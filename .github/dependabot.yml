version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '@babel/*'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      docusaurus:
        patterns: ['@docusaurus/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
